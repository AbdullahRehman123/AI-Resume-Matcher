<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV-Job Matcher</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --border: #e2e2e6;
    --text: #1a1a1e;
    --muted: #6b6b73;
    --accent: #2f5d50;
    --accent-light: #e8f0ed;
    --danger: #b3432f;
    --danger-light: #fbeae6;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  header {
    margin-bottom: 32px;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .upload-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
  }
  .drop-zone {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .drop-zone:hover,
  .drop-zone.dragover {
    border-color: var(--accent);
    background: var(--accent-light);
  }
  .drop-zone input { display: none; }
  .drop-zone .filename {
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--accent);
    font-weight: 600;
  }
  .drop-zone .hint {
    color: var(--muted);
    font-size: 0.85rem;
  }
  button.submit {
    margin-top: 18px;
    width: 100%;
    padding: 12px 16px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button.submit:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  button.submit:hover:not(:disabled) {
    opacity: 0.9;
  }
  .status {
    margin-top: 14px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .status.error {
    color: var(--danger);
  }
  #results {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
  }
  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }
  .result-header h3 {
    margin: 0;
    font-size: 1.05rem;
  }
  .score {
    font-size: 0.85rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .verdict {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: capitalize;
    margin-bottom: 12px;
  }
  .verdict.strong { background: var(--accent-light); color: var(--accent); }
  .verdict.partial { background: #fdf3e2; color: #92620b; }
  .verdict.weak { background: var(--danger-light); color: var(--danger); }
  .explanation {
    font-size: 0.92rem;
    color: var(--text);
    margin-bottom: 14px;
  }
  .skills-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .skills-row .label {
    width: 100%;
    font-size: 0.78rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }
  .chip {
    font-size: 0.8rem;
    padding: 3px 9px;
    border-radius: 6px;
  }
  .chip.matched { background: var(--accent-light); color: var(--accent); }
  .chip.missing { background: var(--danger-light); color: var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CV-Job Matcher</h1>
    <p>Upload a CV (PDF or DOCX) to see how it matches against open roles.</p>
  </header>

  <div class="upload-card">
    <label class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".pdf,.docx">
      <div class="hint">Click to choose a file, or drag one here</div>
      <div class="filename" id="fileName"></div>
    </label>
    <button class="submit" id="submitBtn" disabled>Match against jobs</button>
    <div class="status" id="status"></div>
  </div>

  <div id="results"></div>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const fileName = document.getElementById('fileName');
  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');

  let selectedFile = null;

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });

  ['dragover', 'dragleave', 'drop'].forEach(evt => {
    dropZone.addEventListener(evt, e => e.preventDefault());
  });
  dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });

  function handleFile(file) {
    selectedFile = file;
    fileName.textContent = file.name;
    submitBtn.disabled = false;
    statusEl.textContent = '';
    statusEl.className = 'status';
    resultsEl.innerHTML = '';
  }

  submitBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Matching...';
    statusEl.textContent = '';
    statusEl.className = 'status';
    resultsEl.innerHTML = '';

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const res = await fetch('/match', { method: 'POST', body: formData });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Request failed (${res.status})`);
      }

      const results = await res.json();
      renderResults(results);
    } catch (err) {
      statusEl.textContent = err.message || 'Something went wrong.';
      statusEl.className = 'status error';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Match against jobs';
    }
  });

  function renderResults(results) {
    if (!results.length) {
      statusEl.textContent = 'No jobs to match against yet.';
      return;
    }

    resultsEl.innerHTML = results.map(r => `
      <div class="result-card">
        <div class="result-header">
          <h3>${escapeHtml(r.job_title)}</h3>
          <span class="score">similarity ${(r.similarity_score * 100).toFixed(0)}%</span>
        </div>
        <span class="verdict ${verdictClass(r.verdict)}">${escapeHtml(r.verdict)}</span>
        <p class="explanation">${escapeHtml(r.explanation)}</p>
        ${skillsRow('Matched', r.matched_skills, 'matched')}
        ${skillsRow('Missing', r.missing_skills, 'missing')}
      </div>
    `).join('');
  }

  function skillsRow(label, skills, kind) {
    if (!skills || !skills.length) return '';
    const chips = skills.map(s => `<span class="chip ${kind}">${escapeHtml(s)}</span>`).join('');
    return `<div class="skills-row"><div class="label">${label}</div>${chips}</div>`;
  }

  function verdictClass(verdict) {
    if (verdict.includes('strong')) return 'strong';
    if (verdict.includes('partial')) return 'partial';
    return 'weak';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
