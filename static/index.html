<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV-Job Matcher</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --border: #e2e2e6;
    --text: #1a1a1e;
    --muted: #6b6b73;
    --accent: #2f5d50;
    --accent-light: #e8f0ed;
    --danger: #b3432f;
    --danger-light: #fbeae6;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  header { margin-bottom: 24px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 0.95rem; }

  .mode-toggle {
    display: flex;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px;
    margin-bottom: 20px;
    gap: 4px;
  }
  .mode-btn {
    flex: 1;
    padding: 9px 12px;
    border: none;
    background: transparent;
    border-radius: 7px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .mode-btn.active { background: var(--accent); color: #fff; }

  .panel { display: none; }
  .panel.active { display: block; }

  .upload-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
  }
  label.field-label {
    display: block;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
  }
  select, input[type="email"], input[type="password"], input[type="text"], input[type="number"], textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.9rem;
    margin-bottom: 18px;
    background: #fff;
    color: var(--text);
    font-family: inherit;
  }
  textarea { min-height: 80px; resize: vertical; }

  .job-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
  }
  .job-row-title { font-size: 0.92rem; font-weight: 600; }
  .link-btn.danger { color: var(--danger); }
  #jobsList { margin-top: 20px; }

  .user-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .notice {
    background: var(--accent-light);
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 0.85rem;
    margin-bottom: 16px;
    word-break: break-word;
  }
  .notice a { color: var(--accent); }
  .link-btn {
    background: none;
    border: none;
    padding: 0;
    color: var(--accent);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
  }
  .drop-zone {
    display: block;
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: var(--accent-light);
  }
  .drop-zone input { display: none; }
  .drop-zone .filename { margin-top: 10px; font-size: 0.9rem; color: var(--accent); font-weight: 600; }
  .drop-zone .hint { color: var(--muted); font-size: 0.85rem; }

  button.submit {
    margin-top: 18px;
    width: 100%;
    padding: 12px 16px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button.submit:disabled { opacity: 0.5; cursor: not-allowed; }
  button.submit:hover:not(:disabled) { opacity: 0.9; }

  .status { margin-top: 14px; font-size: 0.9rem; color: var(--muted); }
  .status.error { color: var(--danger); }

  #results { margin-top: 28px; display: flex; flex-direction: column; gap: 16px; }
  .result-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
  .result-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .result-header h3 { margin: 0; font-size: 1.05rem; }
  .result-header .sub { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .score { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
  .verdict {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 0.78rem; font-weight: 600; text-transform: capitalize; margin-bottom: 12px;
  }
  .verdict.strong { background: var(--accent-light); color: var(--accent); }
  .verdict.partial { background: #fdf3e2; color: #92620b; }
  .verdict.weak { background: var(--danger-light); color: var(--danger); }
  .explanation { font-size: 0.92rem; color: var(--text); margin-bottom: 14px; }
  .skills-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .skills-row .label { width: 100%; font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
  .chip { font-size: 0.8rem; padding: 3px 9px; border-radius: 6px; }
  .chip.matched { background: var(--accent-light); color: var(--accent); }
  .chip.missing { background: var(--danger-light); color: var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CV-Job Matcher</h1>
    <p>Upload a CV (PDF or DOCX) to see how it matches against open roles.</p>
  </header>

  <!-- AUTH VIEW -->
  <div id="authView">
    <div class="mode-toggle">
      <button class="mode-btn active" id="loginTabBtn" data-authmode="login">Log in</button>
      <button class="mode-btn" id="signupTabBtn" data-authmode="signup">Sign up</button>
    </div>
    <div class="upload-card">
      <form id="authForm">
        <label class="field-label" for="authEmail">Email</label>
        <input type="email" id="authEmail" required autocomplete="email">
        <label class="field-label" for="authPassword">Password</label>
        <input type="password" id="authPassword" required autocomplete="current-password" minlength="8">
        <button class="submit" id="authSubmitBtn" type="submit">Log in</button>
        <div class="status" id="authStatus"></div>
      </form>
    </div>
  </div>

  <!-- APP VIEW (shown once logged in) -->
  <div id="appView" style="display:none">
    <div class="user-bar">
      <span id="userEmailLabel"></span>
      <button class="link-btn" id="logoutBtn">Log out</button>
    </div>

    <div class="notice" id="verifyBanner" style="display:none"></div>

    <div class="mode-toggle">
      <button class="mode-btn active" id="singleModeBtn" data-mode="single">Single CV</button>
      <button class="mode-btn" id="batchModeBtn" data-mode="batch">Batch CVs</button>
      <button class="mode-btn" id="jobsModeBtn" data-mode="jobs">My Jobs</button>
    </div>

    <!-- SINGLE CV MODE -->
    <div class="panel active" id="singlePanel">
      <div class="upload-card">
        <label class="drop-zone" id="dropZone">
          <input type="file" id="fileInput" accept=".pdf,.docx">
          <div class="hint">Click to choose a file, or drag one here</div>
          <div class="filename" id="fileName"></div>
        </label>
        <button class="submit" id="submitBtn" disabled>Match against jobs</button>
        <div class="status" id="status"></div>
      </div>
    </div>

    <!-- BATCH CV MODE -->
    <div class="panel" id="batchPanel">
      <div class="upload-card">
        <label class="field-label" for="jobSelect">Match against job</label>
        <select id="jobSelect"><option value="">Loading jobs...</option></select>

        <label class="drop-zone" id="batchDropZone">
          <input type="file" id="batchFileInput" accept=".pdf,.docx" multiple>
          <div class="hint">Click to choose files, or drag many CVs here (max 5 per batch)</div>
          <div class="filename" id="batchFileNames"></div>
        </label>
        <button class="submit" id="batchSubmitBtn" disabled>Upload &amp; match batch</button>
        <div class="status" id="batchStatus"></div>
      </div>
    </div>

    <!-- MY JOBS -->
    <div class="panel" id="jobsPanel">
      <div class="upload-card">
        <form id="jobForm">
          <label class="field-label" for="jobTitleInput">Title</label>
          <input type="text" id="jobTitleInput" required>

          <label class="field-label" for="jobDescriptionInput">Description</label>
          <textarea id="jobDescriptionInput" required></textarea>

          <label class="field-label" for="jobSkillsInput">Required skills (comma-separated)</label>
          <input type="text" id="jobSkillsInput" placeholder="e.g. Python, SQL, FastAPI">

          <label class="field-label" for="jobMinYearsInput">Minimum years experience</label>
          <input type="number" id="jobMinYearsInput" min="0" step="0.5" placeholder="Optional">

          <button class="submit" id="jobFormSubmitBtn" type="submit">Create job</button>
          <div class="status" id="jobFormStatus"></div>
        </form>
      </div>

      <div id="jobsList"></div>
    </div>

    <div id="results"></div>
  </div>
</div>

<script>
  // ---------- Session / auth ----------
  const TOKEN_KEY = 'cvMatcherToken';
  const EMAIL_KEY = 'cvMatcherEmail';

  class SessionExpiredError extends Error {}

  function getToken() { return localStorage.getItem(TOKEN_KEY); }
  function setSession(token, email) {
    localStorage.setItem(TOKEN_KEY, token);
    if (email) localStorage.setItem(EMAIL_KEY, email);
  }
  function clearSession() {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(EMAIL_KEY);
  }

  // Wraps fetch() with the Authorization header and centralizes 401
  // handling - any protected endpoint returning 401 (missing/expired
  // token) bounces the user back to the login screen instead of
  // surfacing a confusing error in the middle of the matching UI.
  async function authFetch(url, options = {}) {
    const headers = { ...(options.headers || {}), Authorization: `Bearer ${getToken()}` };
    const res = await fetch(url, { ...options, headers });
    if (res.status === 401) {
      clearSession();
      resetUserState();
      showAuthView();
      throw new SessionExpiredError('Session expired - please log in again.');
    }
    return res;
  }

  const authView = document.getElementById('authView');
  const appView = document.getElementById('appView');
  const userEmailLabel = document.getElementById('userEmailLabel');
  const verifyBanner = document.getElementById('verifyBanner');

  function showAuthView() {
    authView.style.display = '';
    appView.style.display = 'none';
    stopPolling();
  }
  function showAppView() {
    authView.style.display = 'none';
    appView.style.display = '';
    userEmailLabel.textContent = localStorage.getItem(EMAIL_KEY) || '';
  }

  // ---------- Auth form ----------
  const loginTabBtn = document.getElementById('loginTabBtn');
  const signupTabBtn = document.getElementById('signupTabBtn');
  const authForm = document.getElementById('authForm');
  const authEmailInput = document.getElementById('authEmail');
  const authPasswordInput = document.getElementById('authPassword');
  const authSubmitBtn = document.getElementById('authSubmitBtn');
  const authStatus = document.getElementById('authStatus');
  const logoutBtn = document.getElementById('logoutBtn');

  let authMode = 'login';

  function setAuthMode(mode) {
    authMode = mode;
    const isLogin = mode === 'login';
    loginTabBtn.classList.toggle('active', isLogin);
    signupTabBtn.classList.toggle('active', !isLogin);
    authSubmitBtn.textContent = isLogin ? 'Log in' : 'Create account';
    authStatus.textContent = '';
    authStatus.className = 'status';
  }
  loginTabBtn.addEventListener('click', () => setAuthMode('login'));
  signupTabBtn.addEventListener('click', () => setAuthMode('signup'));

  authForm.addEventListener('submit', async e => {
    e.preventDefault();
    const email = authEmailInput.value.trim();
    const password = authPasswordInput.value;

    authSubmitBtn.disabled = true;
    authStatus.textContent = '';
    authStatus.className = 'status';

    try {
      const res = await fetch(`/auth/${authMode === 'login' ? 'login' : 'signup'}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Request failed (${res.status})`);
      }
      const { access_token, verification_link } = await res.json();
      setSession(access_token, email);
      authForm.reset();
      // Logging in as a possibly-different user - wipe whatever the
      // previous session left in the UI (job dropdown, results, selected
      // files, batch polling) rather than letting it linger until
      // something happens to re-fetch it.
      resetUserState();
      showAppView();
      if (verification_link) {
        // Dev-mode stand-in for actually emailing this - remove once real
        // email sending is wired up on the backend.
        verifyBanner.innerHTML = `Email sending isn't wired up yet — click this link to verify your account: ` +
          `<a href="${escapeHtml(verification_link)}" target="_blank" rel="noopener">${escapeHtml(verification_link)}</a>`;
        verifyBanner.style.display = '';
      }
      await loadJobs();
    } catch (err) {
      authStatus.textContent = err.message || 'Something went wrong.';
      authStatus.className = 'status error';
    } finally {
      authSubmitBtn.disabled = false;
    }
  });

  logoutBtn.addEventListener('click', () => {
    clearSession();
    resetUserState();
    showAuthView();
  });

  // ---------- Mode toggle ----------
  const singleModeBtn = document.getElementById('singleModeBtn');
  const batchModeBtn = document.getElementById('batchModeBtn');
  const jobsModeBtn = document.getElementById('jobsModeBtn');
  const singlePanel = document.getElementById('singlePanel');
  const batchPanel = document.getElementById('batchPanel');
  const jobsPanel = document.getElementById('jobsPanel');
  const resultsEl = document.getElementById('results');

  function setMode(mode) {
    const isSingle = mode === 'single';
    const isBatch = mode === 'batch';
    const isJobs = mode === 'jobs';
    singleModeBtn.classList.toggle('active', isSingle);
    batchModeBtn.classList.toggle('active', isBatch);
    jobsModeBtn.classList.toggle('active', isJobs);
    singlePanel.classList.toggle('active', isSingle);
    batchPanel.classList.toggle('active', isBatch);
    jobsPanel.classList.toggle('active', isJobs);
    resultsEl.innerHTML = '';
    stopPolling();
    if (isBatch || isJobs) loadJobs();
  }
  singleModeBtn.addEventListener('click', () => setMode('single'));
  batchModeBtn.addEventListener('click', () => setMode('batch'));
  jobsModeBtn.addEventListener('click', () => setMode('jobs'));

  // ---------- Shared result rendering ----------
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function verdictClass(verdict) {
    if (verdict.includes('strong')) return 'strong';
    if (verdict.includes('partial')) return 'partial';
    return 'weak';
  }
  function skillsRow(label, skills, kind) {
    if (!skills || !skills.length) return '';
    const chips = skills.map(s => `<span class="chip ${kind}">${escapeHtml(s)}</span>`).join('');
    return `<div class="skills-row"><div class="label">${label}</div>${chips}</div>`;
  }
  function resultCardHtml(r, title, subtitle) {
    return `
      <div class="result-card">
        <div class="result-header">
          <div>
            <h3>${escapeHtml(title)}</h3>
            ${subtitle ? `<div class="sub">${escapeHtml(subtitle)}</div>` : ''}
          </div>
          <span class="score">similarity ${(r.similarity_score * 100).toFixed(0)}%</span>
        </div>
        <span class="verdict ${verdictClass(r.verdict)}">${escapeHtml(r.verdict)}</span>
        <p class="explanation">${escapeHtml(r.explanation)}</p>
        ${skillsRow('Matched', r.matched_skills, 'matched')}
        ${skillsRow('Missing', r.missing_skills, 'missing')}
      </div>
    `;
  }

  // ---------- SINGLE CV MODE ----------
  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const fileName = document.getElementById('fileName');
  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');

  let selectedFile = null;

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });
  ['dragover', 'dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, e => e.preventDefault()));
  dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });

  function handleFile(file) {
    selectedFile = file;
    fileName.textContent = file.name;
    submitBtn.disabled = false;
    statusEl.textContent = '';
    statusEl.className = 'status';
    resultsEl.innerHTML = '';
  }

  submitBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Matching...';
    statusEl.textContent = '';
    statusEl.className = 'status';
    resultsEl.innerHTML = '';

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const res = await authFetch('/match', { method: 'POST', body: formData });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Request failed (${res.status})`);
      }
      const results = await res.json();
      if (!results.length) {
        statusEl.textContent = 'No jobs to match against yet.';
      } else {
        resultsEl.innerHTML = results.map(r => resultCardHtml(r, r.job_title, null)).join('');
      }
    } catch (err) {
      if (!(err instanceof SessionExpiredError)) {
        statusEl.textContent = err.message || 'Something went wrong.';
        statusEl.className = 'status error';
      }
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Match against jobs';
    }
  });

  // ---------- BATCH CV MODE ----------
  const jobSelect = document.getElementById('jobSelect');
  const batchFileInput = document.getElementById('batchFileInput');
  const batchDropZone = document.getElementById('batchDropZone');
  const batchFileNames = document.getElementById('batchFileNames');
  const batchSubmitBtn = document.getElementById('batchSubmitBtn');
  const batchStatus = document.getElementById('batchStatus');

  let selectedBatchFiles = [];
  let pollTimer = null;

  // Single fetch feeding both the batch-mode job dropdown and the My Jobs
  // list below - they show the same underlying data, so refreshing them
  // from separate fetches risked them drifting out of sync.
  async function loadJobs() {
    try {
      const res = await authFetch('/jobs');
      const jobs = await res.json();
      renderJobSelect(jobs);
      renderJobsList(jobs);
    } catch (err) {
      if (!(err instanceof SessionExpiredError)) {
        jobSelect.innerHTML = '<option value="">Could not load jobs</option>';
        jobsListEl.innerHTML = '<p class="status error">Could not load jobs.</p>';
      }
    }
  }

  function renderJobSelect(jobs) {
    if (!jobs.length) {
      jobSelect.innerHTML = '<option value="">No jobs yet - add one via POST /jobs</option>';
      return;
    }
    jobSelect.innerHTML = jobs.map(j => `<option value="${j.id}">${escapeHtml(j.title)}</option>`).join('');
  }

  batchFileInput.addEventListener('change', () => {
    if (batchFileInput.files.length) handleBatchFiles(Array.from(batchFileInput.files));
  });
  ['dragover', 'dragleave', 'drop'].forEach(evt => batchDropZone.addEventListener(evt, e => e.preventDefault()));
  batchDropZone.addEventListener('dragover', () => batchDropZone.classList.add('dragover'));
  batchDropZone.addEventListener('dragleave', () => batchDropZone.classList.remove('dragover'));
  batchDropZone.addEventListener('drop', e => {
    batchDropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleBatchFiles(Array.from(e.dataTransfer.files));
  });

  const MAX_BATCH_SIZE = 5;

  function handleBatchFiles(files) {
    if (files.length > MAX_BATCH_SIZE) {
      selectedBatchFiles = [];
      batchFileNames.textContent = '';
      batchSubmitBtn.disabled = true;
      batchStatus.textContent = `Too many files: ${files.length} selected, max is ${MAX_BATCH_SIZE} per batch.`;
      batchStatus.className = 'status error';
      return;
    }
    selectedBatchFiles = files;
    batchFileNames.textContent = files.length === 1 ? files[0].name : `${files.length} files selected`;
    batchSubmitBtn.disabled = false;
    batchStatus.textContent = '';
    batchStatus.className = 'status';
    resultsEl.innerHTML = '';
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  batchSubmitBtn.addEventListener('click', async () => {
    const jobId = jobSelect.value;
    if (!jobId) {
      batchStatus.textContent = 'Select a job to match against first.';
      batchStatus.className = 'status error';
      return;
    }
    if (!selectedBatchFiles.length) return;

    batchSubmitBtn.disabled = true;
    batchStatus.textContent = 'Uploading batch...';
    batchStatus.className = 'status';
    resultsEl.innerHTML = '';

    const formData = new FormData();
    selectedBatchFiles.forEach(f => formData.append('files', f));

    try {
      const res = await authFetch('/candidates/batch', { method: 'POST', body: formData });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Upload failed (${res.status})`);
      }
      const { batch_id, queued, skipped } = await res.json();
      batchStatus.textContent = `Queued ${queued} CV(s)${skipped ? `, skipped ${skipped}` : ''}. Extracting...`;
      pollBatchStatus(batch_id, jobId);
    } catch (err) {
      if (!(err instanceof SessionExpiredError)) {
        batchStatus.textContent = err.message || 'Something went wrong.';
        batchStatus.className = 'status error';
      }
      batchSubmitBtn.disabled = false;
    }
  });

  function pollBatchStatus(batchId, jobId) {
    stopPolling();
    pollTimer = setInterval(async () => {
      try {
        const res = await authFetch(`/candidates/batch/${batchId}`);
        if (!res.ok) throw new Error('Could not check batch status');
        const { total, status_counts } = await res.json();
        const pending = status_counts.pending || 0;

        batchStatus.textContent = `Extracting: ${total - pending}/${total} done` +
          (status_counts.rejected ? `, ${status_counts.rejected} rejected` : '') +
          (status_counts.failed ? `, ${status_counts.failed} failed` : '');

        if (pending === 0) {
          stopPolling();
          await fetchBatchResults(jobId, batchId);
        }
      } catch (err) {
        stopPolling();
        if (!(err instanceof SessionExpiredError)) {
          batchStatus.textContent = err.message || 'Something went wrong while polling.';
          batchStatus.className = 'status error';
        }
        batchSubmitBtn.disabled = false;
      }
    }, 2000);
  }

  async function fetchBatchResults(jobId, batchId) {
    batchStatus.textContent = 'Ranking candidates...';
    try {
      const res = await authFetch(`/jobs/${jobId}/match-batch/${batchId}`);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Ranking failed (${res.status})`);
      }
      const results = await res.json();
      batchStatus.textContent = `Done - ${results.length} candidate(s) matched.`;
      batchStatus.className = 'status';
      resultsEl.innerHTML = results.length
        ? results.map(r => resultCardHtml(r, r.candidate_name || r.filename, r.filename)).join('')
        : '<p class="status">No extracted candidates matched.</p>';
    } catch (err) {
      if (!(err instanceof SessionExpiredError)) {
        batchStatus.textContent = err.message || 'Something went wrong.';
        batchStatus.className = 'status error';
      }
    } finally {
      batchSubmitBtn.disabled = false;
    }
  }

  // ---------- MY JOBS ----------
  const jobForm = document.getElementById('jobForm');
  const jobTitleInput = document.getElementById('jobTitleInput');
  const jobDescriptionInput = document.getElementById('jobDescriptionInput');
  const jobSkillsInput = document.getElementById('jobSkillsInput');
  const jobMinYearsInput = document.getElementById('jobMinYearsInput');
  const jobFormSubmitBtn = document.getElementById('jobFormSubmitBtn');
  const jobFormStatus = document.getElementById('jobFormStatus');
  const jobsListEl = document.getElementById('jobsList');

  function renderJobsList(jobs) {
    if (!jobs.length) {
      jobsListEl.innerHTML = '<p class="status">No jobs yet - create one above.</p>';
      return;
    }
    jobsListEl.innerHTML = jobs.map(j => `
      <div class="job-row">
        <span class="job-row-title">${escapeHtml(j.title)}</span>
        <button class="link-btn danger" data-delete-job="${j.id}">Delete</button>
      </div>
    `).join('');
  }

  jobForm.addEventListener('submit', async e => {
    e.preventDefault();
    const title = jobTitleInput.value.trim();
    const description = jobDescriptionInput.value.trim();
    const required_skills = jobSkillsInput.value.split(',').map(s => s.trim()).filter(Boolean);
    const minYearsRaw = jobMinYearsInput.value;
    const min_years_experience = minYearsRaw === '' ? null : Number(minYearsRaw);

    jobFormSubmitBtn.disabled = true;
    jobFormStatus.textContent = '';
    jobFormStatus.className = 'status';

    try {
      const res = await authFetch('/jobs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description, required_skills, min_years_experience }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Request failed (${res.status})`);
      }
      jobForm.reset();
      jobFormStatus.textContent = 'Job created.';
      await loadJobs();
    } catch (err) {
      if (!(err instanceof SessionExpiredError)) {
        jobFormStatus.textContent = err.message || 'Something went wrong.';
        jobFormStatus.className = 'status error';
      }
    } finally {
      jobFormSubmitBtn.disabled = false;
    }
  });

  jobsListEl.addEventListener('click', async e => {
    const btn = e.target.closest('[data-delete-job]');
    if (!btn) return;
    const jobId = btn.dataset.deleteJob;

    btn.disabled = true;
    jobFormStatus.textContent = '';
    jobFormStatus.className = 'status';

    try {
      const res = await authFetch(`/jobs/${jobId}`, { method: 'DELETE' });
      if (!res.ok && res.status !== 204) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Delete failed (${res.status})`);
      }
      await loadJobs();
    } catch (err) {
      if (!(err instanceof SessionExpiredError)) {
        jobFormStatus.textContent = err.message || 'Something went wrong.';
        jobFormStatus.className = 'status error';
        btn.disabled = false;
      }
    }
  });

  // ---------- User-state reset (login/logout/session-expiry) ----------
  // Login/logout changes WHO the data belongs to, not just whether a token
  // exists - without this, switching accounts in the same tab leaves the
  // previous user's job dropdown, results, and batch status on screen
  // until something happens to trigger a re-fetch (e.g. re-clicking a tab).
  function resetUserState() {
    stopPolling();
    resultsEl.innerHTML = '';
    verifyBanner.style.display = 'none';
    verifyBanner.innerHTML = '';

    selectedFile = null;
    fileName.textContent = '';
    submitBtn.disabled = true;
    statusEl.textContent = '';
    statusEl.className = 'status';

    selectedBatchFiles = [];
    batchFileNames.textContent = '';
    batchSubmitBtn.disabled = true;
    batchStatus.textContent = '';
    batchStatus.className = 'status';
    jobSelect.innerHTML = '<option value="">Loading jobs...</option>';

    jobForm.reset();
    jobFormStatus.textContent = '';
    jobFormStatus.className = 'status';
    jobsListEl.innerHTML = '<p class="status">Loading jobs...</p>';
  }

  // ---------- Init ----------
  if (getToken()) {
    showAppView();
  } else {
    showAuthView();
  }
</script>
</body>
</html>
